<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>About — Mm'sWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg:         #0a0a0a;
      --surface:    #141414;
      --surface-2:  #1c1c1c;
      --text:       #f0f0ee;
      --text-muted: #888888;
      --border:     #262626;
      --font-display: 'Pirata One', serif;
      --font-body:    'Poppins', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background-color: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      height: 72px;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.02em;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      position: relative;
      transition: opacity 0.2s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      width: 0; height: 1.5px;
      background: var(--text);
      transition: width 0.25s ease;
    }

    .nav-links a:hover::after { width: 100%; }
    .nav-links a:hover { opacity: 0.5; }
    .nav-links a.active { opacity: 0.5; }
    .nav-links a.active::after { width: 100%; }

    /* ── MAIN ── */
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 100px 5% 80px;
      position: relative;
      overflow: hidden;
      background: #000;
    }

    main::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url('./Image/Pcity.jpg');
      background-size: cover;
      background-position: center;
      filter: grayscale(100%);
      opacity: 0.2;
      z-index: 0;
    }

    main > * { position: relative; z-index: 1; }

    .about-card {
      max-width: 520px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* 标题 */
    .about-card h1 {
      font-family: var(--font-display);
      font-size: clamp(2.4rem, 6vw, 3.6rem);
      line-height: 1.1;
      color: var(--text);
      margin-bottom: 2.4rem;
    }

    /* 头像 */
    .avatar-wrap {
      width: 130px;
      height: 130px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      background: var(--surface);
      margin-bottom: 2rem;
      flex-shrink: 0;
    }

    .avatar-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    /* 无图时占位 */
    .avatar-placeholder {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      background: linear-gradient(135deg, #1a0d2e, #0d2e1a);
    }

    /* 介绍文字 */
    .about-bio {
      font-size: 0.92rem;
      font-weight: 300;
      color: var(--text-muted);
      line-height: 1.9;
      margin-bottom: 2.4rem;
    }

    .about-bio strong {
      color: var(--text);
      font-weight: 500;
    }

    /* 分割线 */
    .divider {
      width: 40px;
      height: 1px;
      background: var(--border);
      margin: 0 auto 2.4rem;
    }

    /* 社交图标 */
    .social-icons {
      display: flex;
      gap: 1.2rem;
      align-items: center;
      justify-content: center;
    }

    .social-icon {
      width: 42px;
      height: 42px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--surface);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--text-muted);
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s, background 0.2s;
    }

    .social-icon:hover {
      border-color: #444;
      color: var(--text);
      background: var(--surface-2);
    }

    .social-icon svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2rem 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-logo {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--text);
      text-decoration: none;
    }

    .footer-bottom {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── HAMBURGER BUTTON ── */
    .nav-burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      z-index: 101;
    }

    .nav-burger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.2s ease;
    }

    .nav-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-burger.open span:nth-child(2) { opacity: 0; }
    .nav-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 768px) {
      .nav-burger { display: flex; }

      .nav-links {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 72px;
        left: 0;
        right: 0;
        background: rgba(10,10,10,0.97);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 0.5rem 5% 1rem;
        gap: 0;
        transform: translateY(-110%);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.32s ease, opacity 0.25s ease;
      }

      .nav-links.open {
        transform: translateY(0);
        opacity: 1;
        pointer-events: auto;
      }

      .nav-links li { border-bottom: 1px solid var(--border); }
      .nav-links li:last-child { border-bottom: none; }

      .nav-links a {
        display: block;
        padding: 1rem 0;
        font-size: 1rem;
        letter-spacing: 0.06em;
      }
    }
  </style>
  <!-- ═══ MINIPAPER THEME OVERRIDE — mid-century print / Dunkirk poster style ═══ -->
  <style>
    :root {
      --white: #F4F0E6;
      --black: #1E1D1A;
      --bg:        #F4F0E6;   /* warm natural paper */
      --surface:   #EEE8DC;   /* card paper */
      --surface-2: #E3DCCF;
      --text:      #1E1D1A;   /* ink */
      --text-muted:#5C584D;
      --border:    #B9B0A1;
      --mint:     #3E7C74;    /* print teal */
      --pink:     #C0533C;    /* print red-orange */
      --lavender: #3E7C74;
      --electric-blue: #35617e;
      --accent:    #C0533C;
      --accent-dim:#8F3E2D;
      /* poster palette — reserved for accents */
      --ink-charcoal: #3B382F;
      --ink-teal:     #3E7C74;
      --ink-olive:    #6B7C3E;
      --ink-mustard:  #D9A441;
      --ink-red:      #C0533C;
    }

    body {
      background: var(--bg);
      color: var(--text);
    }

    /* film-grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.5;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='table' tableValues='0 0.06'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* aged-paper stains & vignette */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9997;
      mix-blend-mode: multiply;
      background:
        radial-gradient(ellipse at 12% 8%,  rgba(150,110,50,0.10), transparent 45%),
        radial-gradient(ellipse at 88% 22%, rgba(140,100,45,0.08), transparent 40%),
        radial-gradient(ellipse at 25% 85%, rgba(130,95,45,0.09),  transparent 45%),
        radial-gradient(ellipse at 72% 68%, rgba(150,115,55,0.07), transparent 50%),
        radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(95,72,38,0.16) 100%);
    }

    /* nav — paper, hairline rule, spaced caps */
    nav {
      background: rgba(234,224,201,0.92) !important;
      border-bottom: 1px solid var(--text) !important;
    }
    .nav-links a {
      text-transform: uppercase !important;
      font-size: 0.68rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.16em !important;
    }
    .nav-links a::after { background: var(--text) !important; }
    .nav-burger span { background: var(--text) !important; }

    /* hero — monochrome print photo on paper */
    .hero { background: var(--bg) !important; }
    .hero::before {
      filter: grayscale(100%) contrast(1.08) !important;
      opacity: 0.38 !important;
      mix-blend-mode: multiply;
    }
    .hero-name { font-size: clamp(3.2rem, 10vw, 8rem) !important; text-transform: none; }
    .hero-tagline { color: var(--text-muted) !important; }
    .hero-tagline em { color: var(--text) !important; }
    .hero-eyebrow { color: var(--text-muted) !important; letter-spacing: 0.22em !important; }

    /* flat print geometry — no radii, no glow */
    .btn, .work-card, .about-img, .about-img-placeholder, .about-badge,
    .about-section, .contact-section, .chip, .kw-tag, .social-links a,
    .form-group input, .form-group textarea, .nav-burger span {
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    .btn:hover, .work-card:hover { box-shadow: none !important; transform: none !important; }

    .btn {
      text-transform: uppercase;
      font-size: 0.72rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.14em !important;
      padding: 0.8rem 1.6rem !important;
    }
    .btn-primary { background: var(--text) !important; color: var(--bg) !important; border: 1.5px solid var(--text) !important; }
    .btn-primary:hover { background: var(--bg) !important; color: var(--text) !important; }
    .btn-outline { background: transparent !important; color: var(--text) !important; border: 1.5px solid var(--text) !important; }
    .btn-outline:hover { background: var(--text) !important; color: var(--bg) !important; }

    .section-label {
      color: var(--text) !important;
      letter-spacing: 0.24em !important;
      border-bottom: none;
    }
    .section-sub, .work-card-desc, .pub-text, .kw-desc { color: var(--text-muted) !important; }

    /* cards — hairline ink borders on paper */
    .work-card, .about-badge, .contact-section {
      background: var(--bg) !important;
      border: 1px solid var(--text) !important;
    }
    .work-card:hover { background: var(--surface) !important; border-color: var(--text) !important; }
    .work-card-placeholder { filter: grayscale(85%) contrast(1.05); }
    .work-card-tag { color: var(--accent) !important; }
    .about-section { background: var(--surface) !important; margin: 0 !important; }

    .chip { background: transparent !important; border: 1px solid var(--text) !important; color: var(--text) !important; }

    /* research keyword tags — solid print inks */
    .kw-tag.amber  { background: #D9A441 !important; color: #1E1D1A !important; }
    .kw-tag.red    { background: #C0533C !important; color: #EAE0C9 !important; }
    .kw-tag.violet { background: #3E7C74 !important; color: #EAE0C9 !important; }
    .kw-tag { font-weight: 700 !important; text-transform: uppercase; letter-spacing: 0.08em !important; }

    .page-header blockquote { border-left: 2px solid var(--text) !important; }
    .pub-year { border-bottom: 2px solid var(--text) !important; font-size: 1.6rem !important; }
    .pub-text a { color: var(--text-muted) !important; }
    .pub-text a:hover { color: var(--accent) !important; }

    /* forms */
    .form-group input, .form-group textarea {
      background: transparent !important;
      border: 1px solid var(--text) !important;
      color: var(--text) !important;
    }
    .form-group input::placeholder, .form-group textarea::placeholder { color: #9a927e !important; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent) !important; }

    /* footer */
    footer { border-top: 1px solid var(--text) !important; }
    .social-links a { border: 1px solid var(--text) !important; color: var(--text) !important; }
    .social-links a:hover { background: var(--text) !important; color: var(--bg) !important; }

    @media (max-width: 768px) {
      .nav-links {
        background: rgba(234,224,201,0.98) !important;
        border-bottom: 1px solid var(--text) !important;
      }
      .nav-links li { border-bottom: 1px solid var(--border) !important; }
    }
  </style>

  <style>
    /* minipaper fix: full-bleed photo sections -> paper with print photo */
    main, .hero { background: var(--bg) !important; }
    main::before, .hero::before {
      opacity: 0.35 !important;
      filter: grayscale(100%) contrast(1.08) !important;
      mix-blend-mode: multiply;
    }
  </style>
  <style>
    /* ═══ paper-sheet layout — the page IS a sheet of paper on a desk ═══ */
    html { background: #2E2A24; }

    body {
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
      box-shadow: 0 0 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.35);
    }

    /* nav stays inside the sheet */
    nav {
      position: sticky !important;
      left: auto !important;
      right: auto !important;
    }

    /* constrain grain + stains to the sheet, not the desk */
    body::before, body::after {
      left: 50% !important;
      right: auto !important;
      width: min(100vw, 1200px);
      transform: translateX(-50%);
    }

    /* photos mounted on the paper, poster-style, with margins around */
    .hero::before, main::before, .page-header::before {
      inset: auto !important;
      top: 120px !important;
      left: 6% !important;
      right: 6% !important;
      bottom: 10% !important;
      box-shadow: 0 0 0 1px rgba(30,29,26,0.25);
    }

    @media (max-width: 768px) {
      .hero::before, main::before, .page-header::before {
        top: 96px !important;
        left: 5% !important;
        right: 5% !important;
      }
    }
  </style>
  <!-- ═══ ANTIQUE PASS — faded ink, old hand feel ═══ -->
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* faded iron-gall ink, not printing-press black */
      --text:       #3d3226;
      --text-muted: #6f5f4a;
      --border:     #b3a380;
      --black:      #3d3226;
      --font-display: 'IM Fell English SC', 'IM Fell English', Georgia, 'Songti SC', 'STSong', serif;
      --font-body:    'IM Fell English', Georgia, 'Songti SC', 'STSong', serif;
      /* hand-drawn wavering rule */
      --squiggle: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='7' viewBox='0 0 120 7'><path d='M0 3.5 Q 10 1.8 20 3.4 T 40 3.6 T 60 4.1 T 80 2.9 T 100 3.8 T 120 3.3' fill='none' stroke='%234a3b2a' stroke-width='1.1' stroke-linecap='round' opacity='0.7'/></svg>");
    }

    /* ink bleed — soften every letter edge slightly */
    body { text-shadow: 0 0 0.6px rgba(61,50,38,0.5); }

    /* mottled water-stained paper: add low-frequency blotches to the stain layer */
    body::before {
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='0.011' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.19  0 0 0 0.55 0'/><feComponentTransfer><feFuncA type='gamma' amplitude='1' exponent='4.5' offset='0'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23m)'/></svg>") repeat,
        radial-gradient(ellipse at 12% 8%,  rgba(150,110,50,0.13), transparent 45%),
        radial-gradient(ellipse at 88% 22%, rgba(140,100,45,0.10), transparent 40%),
        radial-gradient(ellipse at 25% 85%, rgba(130,95,45,0.11),  transparent 45%),
        radial-gradient(ellipse at 72% 68%, rgba(150,115,55,0.08), transparent 50%),
        radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(95,72,38,0.20) 100%) !important;
    }
    body::after { opacity: 0.62 !important; }

    /* wavering hand rules instead of machine lines */
    nav {
      border-bottom: none !important;
      background-image: var(--squiggle) !important;
      background-repeat: repeat-x !important;
      background-position: left bottom !important;
      background-color: rgba(234,224,201,0.92) !important;
    }
    footer {
      border-top: none !important;
      background: var(--squiggle) repeat-x left top;
      padding-top: 2.2rem !important;
    }
    .pub-year {
      border-bottom: none !important;
      background: var(--squiggle) repeat-x left bottom;
      padding-bottom: 0.9rem !important;
    }
    .page-header blockquote { border-left-color: rgba(74,59,42,0.55) !important; }

    /* aged albumen photographs — sepia, washed out, feathered into the paper */
    .hero::before, main::before, .page-header::before {
      filter: sepia(0.55) grayscale(0.35) contrast(0.8) brightness(1.06) !important;
      opacity: 0.32 !important;
      box-shadow: inset 0 0 70px 35px #EAE0C9 !important;
      transform: rotate(-0.4deg);
    }

    /* nothing sits perfectly straight on an old sheet */
    .work-card:nth-child(odd)  { transform: rotate(0.5deg); }
    .work-card:nth-child(even) { transform: rotate(-0.45deg); }
    .work-card:hover { transform: rotate(0deg) !important; }
    .kw-item:nth-child(1) .kw-tag { transform: rotate(-0.8deg); }
    .kw-item:nth-child(2) .kw-tag { transform: rotate(0.6deg); }
    .kw-item:nth-child(3) .kw-tag { transform: rotate(-0.5deg); }
    .pub-tags .kw-tag:nth-child(odd)  { transform: rotate(-0.7deg); }
    .pub-tags .kw-tag:nth-child(even) { transform: rotate(0.6deg); }
    .about-badge { transform: rotate(-1deg); }
    .avatar-wrap { transform: rotate(-1deg); }

    /* soften the modern editorial voice */
    .btn {
      text-transform: none !important;
      letter-spacing: 0.05em !important;
      font-weight: 400 !important;
      font-size: 0.9rem !important;
      font-family: var(--font-body) !important;
    }
    .section-label, .nav-links a {
      font-family: var(--font-display) !important;
      font-weight: 400 !important;
      letter-spacing: 0.14em !important;
    }
    .kw-tag {
      font-family: var(--font-display) !important;
      font-weight: 400 !important;
      letter-spacing: 0.06em !important;
    }
    .hero-eyebrow { font-family: var(--font-display) !important; }

    /* faded ink headings — a touch lighter than body ink */
    .hero-name, .section-heading, .page-header h1, .pub-year, h1, h2 {
      color: #4a3b2a !important;
      text-shadow: 0 0 1px rgba(61,50,38,0.55);
    }
  </style>
  <style>
    /* ═══ specimen cards — ex-libris style, no more dark holes ═══ */
    .work-card, .music-cover {
      background: transparent !important;
      border: 1px solid rgba(61,50,38,0.55) !important;
    }
    .work-card:hover { background: rgba(61,50,38,0.05) !important; border-color: #3d3226 !important; }

    /* placeholder art area: tinted paper with an engraving-plate inner frame */
    .work-card-placeholder, .music-cover-placeholder {
      background: rgba(59,56,47,0.10) !important;
      outline: 1px solid rgba(61,50,38,0.35);
      outline-offset: -10px;
      border-bottom: 1px solid rgba(61,50,38,0.35);
      font-size: 2.4rem !important;
    }
    .work-grid .work-card:nth-child(5n+1) .work-card-placeholder { background: rgba(217,164,65,0.16) !important; }
    .work-grid .work-card:nth-child(5n+2) .work-card-placeholder { background: rgba(62,124,116,0.14) !important; }
    .work-grid .work-card:nth-child(5n+3) .work-card-placeholder { background: rgba(192,83,60,0.13) !important; }
    .work-grid .work-card:nth-child(5n+4) .work-card-placeholder { background: rgba(107,124,62,0.15) !important; }
    .music-cover-placeholder { background: rgba(62,124,116,0.13) !important; }

    /* emoji as faded printed vignettes */
    .work-card-placeholder, .music-cover-placeholder, .work-card-body .work-card-title {
      filter: none;
    }
    .work-card-placeholder, .music-cover-placeholder {
      /* emoji printed as single-colour ink silhouettes */
      color: transparent;
      text-shadow: 0 0 0 rgba(74,59,42,0.7);
    }

      burger.setAttribute('aria-expanded', isOpen);
    });

    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        burger.classList.remove('open');
        navLinks.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
      });
    });
  </script>
</body>
</html>
