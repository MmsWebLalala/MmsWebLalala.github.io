<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chord Tool — Mm'sWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0a0a0a;
      --surface:    #141414;
      --surface-2:  #1c1c1c;
      --text:       #f0f0ee;
      --text-muted: #888888;
      --border:     #262626;
      --accent:     #4f8ef7;
      --accent-dim: #2a4a8a;
      --font-display: 'Pirata One', serif;
      --font-body:    'Poppins', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      height: 72px;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--text);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      position: relative;
      transition: opacity 0.2s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      width: 0; height: 1.5px;
      background: var(--text);
      transition: width 0.25s ease;
    }

    .nav-links a:hover::after { width: 100%; }
    .nav-links a:hover { opacity: 0.5; }
    .nav-links a.active { opacity: 0.5; }
    .nav-links a.active::after { width: 100%; }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 120px 5% 50px;
      text-align: center;
    }

    .page-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .page-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* ── MAIN ── */
    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 5% 6rem;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .tab-btn {
      padding: 0.55rem 1.2rem;
      border-radius: 999px;
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover { border-color: var(--text-muted); }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── SELECTORS ── */
    .selector-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .sel-btn {
      min-width: 40px;
      height: 36px;
      padding: 0 0.7rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .sel-btn:hover { border-color: var(--text-muted); color: var(--text); }
    .sel-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .sel-btn-sm { font-size: 0.7rem; padding: 0 0.55rem; height: 32px; }

    /* ── CHORD CARD ── */
    .chord-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      padding: 1.5rem;
      margin-top: 1.2rem;
    }

    .chord-name {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 0.15rem;
    }

    .chord-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .chord-detail {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .chord-detail b { color: var(--text); font-weight: 500; }

    /* ── PIANO ── */
    .piano-wrap {
      overflow-x: auto;
      padding: 1.2rem 0 0.5rem;
    }

    .piano-wrap svg { display: block; margin: 0 auto; max-width: 100%; }

    /* ── DIATONIC GRID ── */
    .diatonic-row {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .degree-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.15s;
    }

    .degree-btn:hover { border-color: var(--text-muted); }
    .degree-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .degree-roman { font-size: 0.82rem; font-weight: 700; }
    .degree-chord { font-size: 0.62rem; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-logo {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--text);
      text-decoration: none;
    }

    .footer-bottom {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── HAMBURGER ── */
    .nav-burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      z-index: 101;
    }

    .nav-burger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.2s ease;
    }

    .nav-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-burger.open span:nth-child(2) { opacity: 0; }
    .nav-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 768px) {
      .nav-burger { display: flex; }

      .nav-links {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 72px; left: 0; right: 0;
        background: rgba(10,10,10,0.97);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 0.5rem 5% 1rem;
        gap: 0;
        transform: translateY(-110%);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.32s ease, opacity 0.25s ease;
      }

      .nav-links.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
      .nav-links li { border-bottom: 1px solid var(--border); }
      .nav-links li:last-child { border-bottom: none; }
      .nav-links a { display: block; padding: 1rem 0; font-size: 1rem; }

      .diatonic-row { flex-wrap: wrap; }
    }

    /* ── KEY FINDER ── */
    .kf-hint {
      text-align: center;
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .kf-clear {
      display: block;
      margin: 0 auto 1rem;
      background: none;
      border: none;
      color: var(--accent);
      font-family: var(--font-body);
      font-size: 0.75rem;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .kf-clear:hover { opacity: 0.7; }

    .kf-results-title {
      text-align: center;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 0.8rem;
    }

    .kf-empty {
      text-align: center;
      font-size: 0.85rem;
      color: var(--text-muted);
      opacity: 0.5;
      padding: 3rem 0;
    }

    .key-match {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.75rem 1rem;
      margin-bottom: 0.5rem;
      transition: border-color 0.2s;
    }

    .key-match.perfect { border-color: var(--accent); background: rgba(79,142,247,0.08); }

    .key-match-name {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text);
    }

    .key-match-notes {
      font-size: 0.72rem;
      color: var(--text-muted);
      margin-left: 0.6rem;
    }

    .key-match-badge {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      background: var(--surface-2);
      color: var(--text-muted);
    }

    .key-match.perfect .key-match-badge {
      background: var(--accent);
      color: #fff;
    }

    /* ── KEY REFERENCE ── */
    .kr-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      padding: 1.5rem;
    }

    .kr-title {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 0.6rem;
    }

    .kr-notes {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .kr-notes b { color: var(--text); font-weight: 500; }

    .kr-degrees {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 0.4rem;
      text-align: center;
      margin-bottom: 1rem;
    }

    .kr-deg-note {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text);
    }

    .kr-deg-label {
      font-size: 0.6rem;
      color: var(--text-muted);
      margin-top: 0.15rem;
    }
  </style>
  <!-- ═══ MINIPAPER THEME OVERRIDE — mid-century print / Dunkirk poster style ═══ -->
  <style>
    :root {
      --white: #F4F0E6;
      --black: #1E1D1A;
      --bg:        #F4F0E6;   /* warm natural paper */
      --surface:   #EEE8DC;   /* card paper */
      --surface-2: #E3DCCF;
      --text:      #1E1D1A;   /* ink */
      --text-muted:#5C584D;
      --border:    #B9B0A1;
      --mint:     #3E7C74;    /* print teal */
      --pink:     #C0533C;    /* print red-orange */
      --lavender: #3E7C74;
      --electric-blue: #35617e;
      --accent:    #C0533C;
      --accent-dim:#8F3E2D;
      /* poster palette — reserved for accents */
      --ink-charcoal: #3B382F;
      --ink-teal:     #3E7C74;
      --ink-olive:    #6B7C3E;
      --ink-mustard:  #D9A441;
      --ink-red:      #C0533C;
    }

    body {
      background: var(--bg);
      color: var(--text);
    }

    /* film-grain overlay */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9998;
      opacity: 0.5;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='table' tableValues='0 0.06'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
    }

    /* aged-paper stains & vignette */
    body::before {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9997;
      mix-blend-mode: multiply;
      background:
        radial-gradient(ellipse at 12% 8%,  rgba(150,110,50,0.10), transparent 45%),
        radial-gradient(ellipse at 88% 22%, rgba(140,100,45,0.08), transparent 40%),
        radial-gradient(ellipse at 25% 85%, rgba(130,95,45,0.09),  transparent 45%),
        radial-gradient(ellipse at 72% 68%, rgba(150,115,55,0.07), transparent 50%),
        radial-gradient(ellipse at 50% 45%, transparent 55%, rgba(95,72,38,0.16) 100%);
    }

    /* nav — paper, hairline rule, spaced caps */
    nav {
      background: rgba(234,224,201,0.92) !important;
      border-bottom: 1px solid var(--text) !important;
    }
    .nav-links a {
      text-transform: uppercase !important;
      font-size: 0.68rem !important;
      font-weight: 600 !important;
      letter-spacing: 0.16em !important;
    }
    .nav-links a::after { background: var(--text) !important; }
    .nav-burger span { background: var(--text) !important; }

    /* hero — monochrome print photo on paper */
    .hero { background: var(--bg) !important; }
    .hero::before {
      filter: grayscale(100%) contrast(1.08) !important;
      opacity: 0.38 !important;
      mix-blend-mode: multiply;
    }
    .hero-name { font-size: clamp(3.2rem, 10vw, 8rem) !important; text-transform: none; }
    .hero-tagline { color: var(--text-muted) !important; }
    .hero-tagline em { color: var(--text) !important; }
    .hero-eyebrow { color: var(--text-muted) !important; letter-spacing: 0.22em !important; }

    /* flat print geometry — no radii, no glow */
    .btn, .work-card, .about-img, .about-img-placeholder, .about-badge,
    .about-section, .contact-section, .chip, .kw-tag, .social-links a,
    .form-group input, .form-group textarea, .nav-burger span {
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    .btn:hover, .work-card:hover { box-shadow: none !important; transform: none !important; }

    .btn {
      text-transform: uppercase;
      font-size: 0.72rem !important;
      font-weight: 700 !important;
      letter-spacing: 0.14em !important;
      padding: 0.8rem 1.6rem !important;
    }
    .btn-primary { background: var(--text) !important; color: var(--bg) !important; border: 1.5px solid var(--text) !important; }
    .btn-primary:hover { background: var(--bg) !important; color: var(--text) !important; }
    .btn-outline { background: transparent !important; color: var(--text) !important; border: 1.5px solid var(--text) !important; }
    .btn-outline:hover { background: var(--text) !important; color: var(--bg) !important; }

    .section-label {
      color: var(--text) !important;
      letter-spacing: 0.24em !important;
      border-bottom: none;
    }
    .section-sub, .work-card-desc, .pub-text, .kw-desc { color: var(--text-muted) !important; }

    /* cards — hairline ink borders on paper */
    .work-card, .about-badge, .contact-section {
      background: var(--bg) !important;
      border: 1px solid var(--text) !important;
    }
    .work-card:hover { background: var(--surface) !important; border-color: var(--text) !important; }
    .work-card-placeholder { filter: grayscale(85%) contrast(1.05); }
    .work-card-tag { color: var(--accent) !important; }
    .about-section { background: var(--surface) !important; margin: 0 !important; }

    .chip { background: transparent !important; border: 1px solid var(--text) !important; color: var(--text) !important; }

    /* research keyword tags — solid print inks */
    .kw-tag.amber  { background: #D9A441 !important; color: #1E1D1A !important; }
    .kw-tag.red    { background: #C0533C !important; color: #EAE0C9 !important; }
    .kw-tag.violet { background: #3E7C74 !important; color: #EAE0C9 !important; }
    .kw-tag { font-weight: 700 !important; text-transform: uppercase; letter-spacing: 0.08em !important; }

    .page-header blockquote { border-left: 2px solid var(--text) !important; }
    .pub-year { border-bottom: 2px solid var(--text) !important; font-size: 1.6rem !important; }
    .pub-text a { color: var(--text-muted) !important; }
    .pub-text a:hover { color: var(--accent) !important; }

    /* forms */
    .form-group input, .form-group textarea {
      background: transparent !important;
      border: 1px solid var(--text) !important;
      color: var(--text) !important;
    }
    .form-group input::placeholder, .form-group textarea::placeholder { color: #9a927e !important; }
    .form-group input:focus, .form-group textarea:focus { border-color: var(--accent) !important; }

    /* footer */
    footer { border-top: 1px solid var(--text) !important; }
    .social-links a { border: 1px solid var(--text) !important; color: var(--text) !important; }
    .social-links a:hover { background: var(--text) !important; color: var(--bg) !important; }

    @media (max-width: 768px) {
      .nav-links {
        background: rgba(234,224,201,0.98) !important;
        border-bottom: 1px solid var(--text) !important;
      }
      .nav-links li { border-bottom: 1px solid var(--border) !important; }
    }
  </style>

  <style>
    /* ═══ paper-sheet layout — the page IS a sheet of paper on a desk ═══ */
    html { background: #2E2A24; }

    body {
      max-width: 1200px;
      margin: 0 auto;
      min-height: 100vh;
      box-shadow: 0 0 70px rgba(0,0,0,0.55), 0 0 0 1px rgba(0,0,0,0.35);
    }

    /* nav stays inside the sheet */
    nav {
      position: sticky !important;
      left: auto !important;
      right: auto !important;
    }

    /* constrain grain + stains to the sheet, not the desk */
    body::before, body::after {
      left: 50% !important;
      right: auto !important;
      width: min(100vw, 1200px);
      transform: translateX(-50%);
    }

    /* photos mounted on the paper, poster-style, with margins around */
    .hero::before, main::before, .page-header::before {
      inset: auto !important;
      top: 120px !important;
      left: 6% !important;
      right: 6% !important;
      bottom: 10% !important;
      box-shadow: 0 0 0 1px rgba(30,29,26,0.25);
    }

    @media (max-width: 768px) {
      .hero::before, main::before, .page-header::before {
        top: 96px !important;
        left: 5% !important;
        right: 5% !important;
      }
    }
  </style>
  <!-- ═══ ANTIQUE PASS — faded ink, old hand feel ═══ -->
  <link href="https://fonts.googleapis.com/css2?family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap" rel="stylesheet" />
  <style>
    :root {
      /* faded iron-gall ink, not printing-press black */
      --text:       #3d3226;
      --text-muted: #6f5f4a;
      --border:     #b3a380;
      --black:      #3d3226;
      --font-display: 'IM Fell English SC', 'IM Fell English', Georgia, 'Songti SC', 'STSong', serif;
      --font-body:    'IM Fell English', Georgia, 'Songti SC', 'STSong', serif;
      /* hand-drawn wavering rule */
      --squiggle: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='7' viewBox='0 0 120 7'><path d='M0 3.5 Q 10 1.8 20 3.4 T 40 3.6 T 60 4.1 T 80 2.9 T 100 3.8 T 120 3.3' fill='none' stroke='%234a3b2a' stroke-width='1.1' stroke-linecap='round' opacity='0.7'/></svg>");
    }

    /* ink bleed — soften every letter edge slightly */
    body { text-shadow: 0 0 0.6px rgba(61,50,38,0.5); }

    /* mottled water-stained paper: add low-frequency blotches to the stain layer */
    body::before {
      background:
        url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='700'><filter id='m'><feTurbulence type='fractalNoise' baseFrequency='0.011' numOctaves='3' seed='7' stitchTiles='stitch'/><feColorMatrix type='matrix' values='0 0 0 0 0.42  0 0 0 0 0.33  0 0 0 0 0.19  0 0 0 0.55 0'/><feComponentTransfer><feFuncA type='gamma' amplitude='1' exponent='4.5' offset='0'/></feComponentTransfer></filter><rect width='100%25' height='100%25' filter='url(%23m)'/></svg>") repeat,
        radial-gradient(ellipse at 12% 8%,  rgba(150,110,50,0.13), transparent 45%),
        radial-gradient(ellipse at 88% 22%, rgba(140,100,45,0.10), transparent 40%),
        radial-gradient(ellipse at 25% 85%, rgba(130,95,45,0.11),  transparent 45%),
        radial-gradient(ellipse at 72% 68%, rgba(150,115,55,0.08), transparent 50%),
        radial-gradient(ellipse at 50% 45%, transparent 52%, rgba(95,72,38,0.20) 100%) !important;
    }
    body::after { opacity: 0.62 !important; }

    /* wavering hand rules instead of machine lines */
    nav {
      border-bottom: none !important;
      background-image: var(--squiggle) !important;
      background-repeat: repeat-x !important;
      background-position: left bottom !important;
      background-color: rgba(234,224,201,0.92) !important;
    }
    footer {
      border-top: none !important;
      background: var(--squiggle) repeat-x left top;
      padding-top: 2.2rem !important;
    }
    .pub-year {
      border-bottom: none !important;
      background: var(--squiggle) repeat-x left bottom;
      padding-bottom: 0.9rem !important;

    const ENHARMONIC = {Db:"C#",Eb:"D#",Fb:"E",Gb:"F#",Ab:"G#",Bb:"A#",Cb:"B","E#":"F","B#":"C"};

    const norm = n => ENHARMONIC[n] || n;
    const nIdx = n => NOTES.indexOf(norm(n));
    const nName = i => NOTES[((i%12)+12)%12];
    const isBlack = i => [1,3,6,8,10].includes(((i%12)+12)%12);

    const CHORDS = {
      maj:   {i:[0,4,7],         l:"Major Triad"},
      min:   {i:[0,3,7],         l:"Minor Triad"},
      dim:   {i:[0,3,6],         l:"Diminished Triad"},
      aug:   {i:[0,4,8],         l:"Augmented Triad"},
      maj7:  {i:[0,4,7,11],      l:"Major 7th"},
      min7:  {i:[0,3,7,10],      l:"Minor 7th"},
      "7":   {i:[0,4,7,10],      l:"Dominant 7th"},
      dim7:  {i:[0,3,6,9],       l:"Diminished 7th"},
      m7b5:  {i:[0,3,6,10],      l:"Half-Diminished 7th"},
      sus2:  {i:[0,2,7],         l:"Suspended 2nd"},
      sus4:  {i:[0,5,7],         l:"Suspended 4th"},
      add9:  {i:[0,4,7,14],      l:"Add 9"},
      "6":   {i:[0,4,7,9],       l:"Major 6th"},
      min6:  {i:[0,3,7,9],       l:"Minor 6th"},
      "9":   {i:[0,4,7,10,14],   l:"Dominant 9th"},
      maj9:  {i:[0,4,7,11,14],   l:"Major 9th"},
      min9:  {i:[0,3,7,10,14],   l:"Minor 9th"},
    };

    const SCALES = {
      major: {iv:[0,2,4,5,7,9,11], q:["maj","min","min","maj","maj","min","dim"]},
      minor: {iv:[0,2,3,5,7,8,10], q:["min","dim","maj","min","min","maj","maj"]},
    };

    const ROMAN = ["I","II","III","IV","V","VI","VII"];

    function getChord(root, type) {
      const f = CHORDS[type];
      const ri = nIdx(root);
      const notes = f.i.map(x => nName(ri + x));
      return {root: norm(root), type, label: f.l, notes, intervals: f.i};
    }

    function fmtChord(root, type) {
      if (type === "maj") return root;
      if (type === "min") return root + "m";
      return root + type;
    }

    function getDiatonic(root, scale) {
      const s = SCALES[scale];
      const ri = nIdx(root);
      return s.iv.map((iv, idx) => {
        const cr = nName(ri + iv);
        const q = s.q[idx];
        let roman = (q === "min" || q === "dim") ? ROMAN[idx].toLowerCase() : ROMAN[idx];
        if (q === "dim") roman += "°";
        return {degree: idx+1, roman, chord: getChord(cr, q)};
      });
    }

    // ── Piano SVG Renderer ──
    function renderPiano(highlightNotes, rootNote) {
      const hSet = new Set(highlightNotes.map(n => nIdx(n)));
      const rootIdx = rootNote !== undefined ? nIdx(rootNote) : -1;
      const WW = 32, WH = 120, BW = 20, BH = 76;
      const BK_OFF = {1:-5, 3:-4, 6:-5, 8:-4, 10:-3};
      const octaves = 2;
      const whites = [], blacks = [];
      let wi = 0;
      for (let oct = 0; oct < octaves; oct++) {
        for (let n = 0; n < 12; n++) {
          if (!isBlack(n)) {
            whites.push({n, x: wi * WW});
            if (BK_OFF[n+1] !== undefined) {
              blacks.push({n: (n+1)%12, x: wi*WW + WW + BK_OFF[n+1]});
            }
            wi++;
          }
        }
      }
      const tw = wi * WW;
      let svg = `<svg viewBox="0 0 ${tw} ${WH+20}" width="${tw}" xmlns="http://www.w3.org/2000/svg">`;
      whites.forEach(({n, x}) => {
        const on = hSet.has(n), isR = n === rootIdx;
        svg += `<rect x="${x}" y="0" width="${WW-1}" height="${WH}" rx="0" ry="3" fill="${isR?'#A3473E':on?'#C0533C':'#F1EADA'}" stroke="#6B655A" stroke-width="0.5"/>`;
        if (on) svg += `<text x="${x+WW/2}" y="${WH+14}" text-anchor="middle" font-size="10" font-weight="${isR?700:400}" fill="#1A1815" font-family="JetBrains Mono,monospace">${nName(n)}</text>`;
      });
      blacks.forEach(({n, x}) => {
        const on = hSet.has(n), isR = n === rootIdx;
        svg += `<rect x="${x}" y="0" width="${BW}" height="${BH}" rx="0" ry="3" fill="${isR?'#8F3E2D':on?'#A3473E':'#1A1815'}" stroke="#000" stroke-width="0.5"/>`;
      });
      svg += '</svg>';
      return svg;
    }

    function chordCardHTML(chord) {
      return `
        <div class="chord-card">
          <div class="chord-name">${fmtChord(chord.root, chord.type)}</div>
          <div class="chord-label">${chord.label}</div>
          <div class="chord-detail">Notes: <b>${chord.notes.join(' - ')}</b></div>
          <div class="chord-detail">Intervals: <b style="font-family:monospace;font-size:0.78rem">${chord.intervals.join(' · ')}</b></div>
          <div class="piano-wrap">${renderPiano(chord.notes, chord.root)}</div>
        </div>`;
    }

    // ── Key Finder ──
    function getScaleNotes(root, scale) {
      const s = SCALES[scale];
      const ri = nIdx(root);
      return s.iv.map(i => nName(ri + i));
    }

    function findKeys(selectedNotes) {
      if (selectedNotes.length === 0) return [];
      const selected = new Set(selectedNotes.map(n => nIdx(n)));
      const results = [];
      for (const root of NOTES) {
        for (const scale of ['major','minor']) {
          const scaleNotes = getScaleNotes(root, scale);
          const scaleSet = new Set(scaleNotes.map(n => nIdx(n)));
          let matchCount = 0;
          for (const s of selected) { if (scaleSet.has(s)) matchCount++; }
          if (matchCount > 0) {
            results.push({ root: norm(root), scale, scaleNotes, matchCount, totalNotes: selectedNotes.length });
          }
        }
      }
      results.sort((a, b) => b.matchCount - a.matchCount);
      return results;
    }

    // ── State ──
    let state = {
      tab: 'chord',
      root: 'C',
      chordType: 'maj',
      scale: 'major',
      diaIdx: 0,
      kfNotes: [],
      krRoot: 'C',
      krScale: 'major',
    };

    // ── Render helpers ──
    function btnRow(container, items, activeVal, onClick, cls='sel-btn') {
      container.innerHTML = '';
      items.forEach(({val, text}) => {
        const b = document.createElement('button');
        b.className = cls + (val === activeVal ? ' active' : '');
        b.textContent = text;
        b.onclick = () => onClick(val);
        container.appendChild(b);
      });
    }

    function render() {
      // Hide root selector on keyfinder tab
      document.getElementById('root-selector').style.display = (state.tab === 'keyfinder' || state.tab === 'keyref') ? 'none' : '';

      btnRow(
        document.getElementById('root-selector'),
        NOTES.map(n => ({val:n, text:n})),
        state.root,
        v => { state.root = v; state.diaIdx = 0; render(); }
      );

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-'+state.tab));

      if (state.tab === 'chord') renderChord();
      else if (state.tab === 'diatonic') renderDiatonic();
      else if (state.tab === 'keyfinder') renderKeyFinder();
      else if (state.tab === 'keyref') renderKeyRef();
    }

    function renderChord() {
      const types = Object.entries(CHORDS).map(([k,v]) => ({val:k, text: k + ' · ' + v.l}));
      btnRow(document.getElementById('type-selector'), types, state.chordType, v => { state.chordType = v; render(); }, 'sel-btn sel-btn-sm');
      document.getElementById('chord-result').innerHTML = chordCardHTML(getChord(state.root, state.chordType));
    }

    function renderDiatonic() {
      btnRow(document.getElementById('scale-selector-d'),
        [{val:'major',text:'Major'},{val:'minor',text:'Minor'}],
        state.scale, v => { state.scale = v; state.diaIdx = 0; render(); });

      const dia = getDiatonic(state.root, state.scale);
      const row = document.getElementById('diatonic-row');
      row.innerHTML = '';
      dia.forEach((d, i) => {
        const b = document.createElement('button');
        b.className = 'degree-btn' + (i === state.diaIdx ? ' active' : '');
        b.innerHTML = `<span class="degree-roman">${d.roman}</span><span class="degree-chord">${fmtChord(d.chord.root, d.chord.type)}</span>`;
        b.onclick = () => { state.diaIdx = i; render(); };
        row.appendChild(b);
      });

      document.getElementById('diatonic-result').innerHTML = chordCardHTML(dia[state.diaIdx].chord);
    }

    function renderKeyFinder() {
      // Note toggle buttons
      const sel = document.getElementById('kf-note-selector');
      sel.innerHTML = '';
      NOTES.forEach(n => {
        const b = document.createElement('button');
        b.className = 'sel-btn' + (state.kfNotes.includes(n) ? ' active' : '');
        b.textContent = n;
        b.onclick = () => {
          if (state.kfNotes.includes(n)) state.kfNotes = state.kfNotes.filter(x => x !== n);
          else state.kfNotes.push(n);
          render();
        };
        sel.appendChild(b);
      });

      // Clear button
      const clearWrap = document.getElementById('kf-clear-wrap');
      if (state.kfNotes.length > 0) {
        clearWrap.innerHTML = '<button class="kf-clear">Clear all</button>';
        clearWrap.querySelector('button').onclick = () => { state.kfNotes = []; render(); };
      } else {
        clearWrap.innerHTML = '';
      }

      // Piano
      document.getElementById('kf-piano').innerHTML = state.kfNotes.length > 0
        ? '<div class="piano-wrap">' + renderPiano(state.kfNotes) + '</div>'
        : '';

      // Results
      const res = document.getElementById('kf-results');
      if (state.kfNotes.length === 0) {
        res.innerHTML = '<p class="kf-empty">Tap notes above to begin</p>';
        return;
      }

      const matches = findKeys(state.kfNotes);
      const shown = matches.filter(m => m.matchCount >= m.totalNotes - 1).slice(0, 12);
      const hasPerfect = shown.some(m => m.matchCount === m.totalNotes);

      let html = '<p class="kf-results-title">' + (hasPerfect ? 'Matching Keys' : 'Closest Keys') + '</p>';
      shown.forEach(m => {
        const perfect = m.matchCount === m.totalNotes;
        html += `<div class="key-match${perfect ? ' perfect' : ''}">
          <div>
            <span class="key-match-name">${m.root} ${m.scale === 'major' ? 'Major' : 'Minor'}</span>
            <span class="key-match-notes">${m.scaleNotes.join(' - ')}</span>
          </div>
          <span class="key-match-badge">${m.matchCount}/${m.totalNotes}</span>
        </div>`;
      });
      res.innerHTML = html;
    }

    function renderKeyRef() {
      btnRow(document.getElementById('kr-root-selector'),
        NOTES.map(n => ({val:n, text:n})),
        state.krRoot, v => { state.krRoot = v; render(); });

      btnRow(document.getElementById('kr-scale-selector'),
        [{val:'major',text:'Major'},{val:'minor',text:'Minor'}],
        state.krScale, v => { state.krScale = v; render(); });

      const notes = getScaleNotes(state.krRoot, state.krScale);
      const degNames = state.krScale === 'major'
        ? ['1 (Tonic)','2 (Supertonic)','3 (Mediant)','4 (Subdominant)','5 (Dominant)','6 (Submediant)','7 (Leading)']
        : ['1 (Tonic)','2 (Supertonic)','3 (Mediant)','4 (Subdominant)','5 (Dominant)','6 (Submediant)','7 (Subtonic)'];

      let degs = '';
      notes.forEach((n, i) => {
        degs += `<div><div class="kr-deg-note">${n}</div><div class="kr-deg-label">${degNames[i]}</div></div>`;
      });

      document.getElementById('kr-result').innerHTML = `
        <div class="kr-card">
          <div class="kr-title">${state.krRoot} ${state.krScale === 'major' ? 'Major' : 'Minor'}</div>
          <div class="kr-notes">Notes: <b>${notes.join(' - ')}</b></div>
          <div class="kr-degrees">${degs}</div>
          <div class="piano-wrap">${renderPiano(notes, state.krRoot)}</div>
        </div>`;
    }

    // ── Tab switching ──
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.onclick = () => { state.tab = b.dataset.tab; render(); };
    });

    // ── Hamburger ──
    const burger = document.getElementById('nav-burger');
    const navLinks = document.getElementById('nav-links');
    burger.addEventListener('click', () => {
      const isOpen = burger.classList.toggle('open');
      navLinks.classList.toggle('open', isOpen);
      burger.setAttribute('aria-expanded', isOpen);
    });
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        burger.classList.remove('open');
        navLinks.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
      });
    });

    // ── Init ──
    render();
  </script>
</body>
</html>
