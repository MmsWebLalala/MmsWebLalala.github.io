<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chord Tool — Mm'sWeb</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:         #0a0a0a;
      --surface:    #141414;
      --surface-2:  #1c1c1c;
      --text:       #f0f0ee;
      --text-muted: #888888;
      --border:     #262626;
      --accent:     #4f8ef7;
      --accent-dim: #2a4a8a;
      --font-display: 'Pirata One', serif;
      --font-body:    'Poppins', sans-serif;
    }

    body {
      font-family: var(--font-body);
      background: var(--bg);
      color: var(--text);
      overflow-x: hidden;
      line-height: 1.6;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 5%;
      height: 72px;
      background: rgba(10,10,10,0.88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-logo {
      font-family: var(--font-display);
      font-size: 1.5rem;
      color: var(--text);
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      gap: 2.5rem;
      list-style: none;
    }

    .nav-links a {
      font-size: 0.82rem;
      font-weight: 500;
      color: var(--text);
      text-decoration: none;
      letter-spacing: 0.04em;
      text-transform: lowercase;
      position: relative;
      transition: opacity 0.2s;
    }

    .nav-links a::after {
      content: '';
      position: absolute;
      bottom: -3px; left: 0;
      width: 0; height: 1.5px;
      background: var(--text);
      transition: width 0.25s ease;
    }

    .nav-links a:hover::after { width: 100%; }
    .nav-links a:hover { opacity: 0.5; }
    .nav-links a.active { opacity: 0.5; }
    .nav-links a.active::after { width: 100%; }

    /* ── PAGE HEADER ── */
    .page-header {
      padding: 120px 5% 50px;
      text-align: center;
    }

    .page-header h1 {
      font-family: var(--font-display);
      font-size: clamp(2.2rem, 5vw, 3.5rem);
      color: var(--text);
      margin-bottom: 0.4rem;
    }

    .page-header p {
      font-size: 0.9rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* ── MAIN ── */
    .main {
      max-width: 760px;
      margin: 0 auto;
      padding: 2rem 5% 6rem;
    }

    /* ── TABS ── */
    .tabs {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 2rem;
    }

    .tab-btn {
      padding: 0.55rem 1.2rem;
      border-radius: 999px;
      font-family: var(--font-body);
      font-size: 0.82rem;
      font-weight: 600;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover { border-color: var(--text-muted); }
    .tab-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .tab-panel { display: none; }
    .tab-panel.active { display: block; }

    /* ── SELECTORS ── */
    .selector-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 1.5rem;
    }

    .sel-btn {
      min-width: 40px;
      height: 36px;
      padding: 0 0.7rem;
      border-radius: 8px;
      font-family: var(--font-body);
      font-size: 0.78rem;
      font-weight: 500;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .sel-btn:hover { border-color: var(--text-muted); color: var(--text); }
    .sel-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }

    .sel-btn-sm { font-size: 0.7rem; padding: 0 0.55rem; height: 32px; }

    /* ── CHORD CARD ── */
    .chord-card {
      border: 1px solid var(--border);
      border-radius: 16px;
      background: var(--surface);
      padding: 1.5rem;
      margin-top: 1.2rem;
    }

    .chord-name {
      font-family: var(--font-display);
      font-size: 1.6rem;
      color: var(--text);
      margin-bottom: 0.15rem;
    }

    .chord-label {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-bottom: 1rem;
    }

    .chord-detail {
      font-size: 0.82rem;
      color: var(--text-muted);
      margin-bottom: 0.4rem;
    }

    .chord-detail b { color: var(--text); font-weight: 500; }

    /* ── PIANO ── */
    .piano-wrap {
      overflow-x: auto;
      padding: 1.2rem 0 0.5rem;
    }

    .piano-wrap svg { display: block; margin: 0 auto; max-width: 100%; }

    /* ── DIATONIC GRID ── */
    .diatonic-row {
      display: flex;
      gap: 0.4rem;
      justify-content: center;
      margin-bottom: 1rem;
    }

    .degree-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.15rem;
      padding: 0.5rem 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      font-family: var(--font-body);
      transition: all 0.15s;
    }

    .degree-btn:hover { border-color: var(--text-muted); }
    .degree-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .degree-roman { font-size: 0.82rem; font-weight: 700; }
    .degree-chord { font-size: 0.62rem; }

    /* ── FOOTER ── */
    footer {
      border-top: 1px solid var(--border);
      padding: 2.5rem 5%;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }

    .footer-logo {
      font-family: var(--font-display);
      font-size: 1.2rem;
      color: var(--text);
      text-decoration: none;
    }

    .footer-bottom {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    /* ── HAMBURGER ── */
    .nav-burger {
      display: none;
      flex-direction: column;
      justify-content: center;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
      z-index: 101;
    }

    .nav-burger span {
      display: block;
      width: 24px;
      height: 2px;
      background: var(--text);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.2s ease;
    }

    .nav-burger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-burger.open span:nth-child(2) { opacity: 0; }
    .nav-burger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    @media (max-width: 768px) {
      .nav-burger { display: flex; }

      .nav-links {
        display: flex;
        flex-direction: column;
        position: fixed;
        top: 72px; left: 0; right: 0;
        background: rgba(10,10,10,0.97);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid var(--border);
        padding: 0.5rem 5% 1rem;
        gap: 0;
        transform: translateY(-110%);
        opacity: 0;
        pointer-events: none;
        transition: transform 0.32s ease, opacity 0.25s ease;
      }

      .nav-links.open { transform: translateY(0); opacity: 1; pointer-events: auto; }
      .nav-links li { border-bottom: 1px solid var(--border); }
      .nav-links li:last-child { border-bottom: none; }
      .nav-links a { display: block; padding: 1rem 0; font-size: 1rem; }

      .diatonic-row { flex-wrap: wrap; }
    }
  </style>
</head>
<body>

  <!-- NAV -->
  <nav>
    <a href="index.html" class="nav-logo">Mm'sWeb</a>
    <ul class="nav-links" id="nav-links">
      <li><a href="research.html">Research</a></li>
      <li><a href="craft.html">Craft</a></li>
      <li><a href="about.html">About</a></li>
    </ul>
    <button class="nav-burger" id="nav-burger" aria-label="Toggle navigation" aria-expanded="false">
      <span></span><span></span><span></span>
    </button>
  </nav>

  <header class="page-header">
    <h1>Chord Tool</h1>
    <p>Piano chord query &amp; diatonic chord explorer</p>
  </header>

  <div class="main">
    <!-- Tabs -->
    <div class="tabs">
      <button class="tab-btn active" data-tab="chord">Chord Lookup</button>
      <button class="tab-btn" data-tab="diatonic">Diatonic Chords</button>
    </div>

    <!-- Root selector (shared) -->
    <div class="selector-row" id="root-selector"></div>

    <!-- Tab: Chord Query -->
    <div class="tab-panel active" id="panel-chord">
      <div class="selector-row" id="type-selector"></div>
      <div id="chord-result"></div>
    </div>

    <!-- Tab: Diatonic -->
    <div class="tab-panel" id="panel-diatonic">
      <div class="selector-row" id="scale-selector-d"></div>
      <div class="diatonic-row" id="diatonic-row"></div>
      <div id="diatonic-result"></div>
    </div>
  </div>

  <footer>
    <a href="index.html" class="footer-logo">Mm'sWeb</a>
    <p class="footer-bottom">© 2026 Mm'sWeb. All rights reserved. · Perth, WA</p>
  </footer>

  <script>
    // ── Music Theory Engine ──
    const NOTES = ["C","C#","D","D#","E","F","F#","G","G#","A","A#","B"];
    const ENHARMONIC = {Db:"C#",Eb:"D#",Fb:"E",Gb:"F#",Ab:"G#",Bb:"A#",Cb:"B","E#":"F","B#":"C"};

    const norm = n => ENHARMONIC[n] || n;
    const nIdx = n => NOTES.indexOf(norm(n));
    const nName = i => NOTES[((i%12)+12)%12];
    const isBlack = i => [1,3,6,8,10].includes(((i%12)+12)%12);

    const CHORDS = {
      maj:   {i:[0,4,7],         l:"Major Triad"},
      min:   {i:[0,3,7],         l:"Minor Triad"},
      dim:   {i:[0,3,6],         l:"Diminished Triad"},
      aug:   {i:[0,4,8],         l:"Augmented Triad"},
      maj7:  {i:[0,4,7,11],      l:"Major 7th"},
      min7:  {i:[0,3,7,10],      l:"Minor 7th"},
      "7":   {i:[0,4,7,10],      l:"Dominant 7th"},
      dim7:  {i:[0,3,6,9],       l:"Diminished 7th"},
      m7b5:  {i:[0,3,6,10],      l:"Half-Diminished 7th"},
      sus2:  {i:[0,2,7],         l:"Suspended 2nd"},
      sus4:  {i:[0,5,7],         l:"Suspended 4th"},
      add9:  {i:[0,4,7,14],      l:"Add 9"},
      "6":   {i:[0,4,7,9],       l:"Major 6th"},
      min6:  {i:[0,3,7,9],       l:"Minor 6th"},
      "9":   {i:[0,4,7,10,14],   l:"Dominant 9th"},
      maj9:  {i:[0,4,7,11,14],   l:"Major 9th"},
      min9:  {i:[0,3,7,10,14],   l:"Minor 9th"},
    };

    const SCALES = {
      major: {iv:[0,2,4,5,7,9,11], q:["maj","min","min","maj","maj","min","dim"]},
      minor: {iv:[0,2,3,5,7,8,10], q:["min","dim","maj","min","min","maj","maj"]},
    };

    const ROMAN = ["I","II","III","IV","V","VI","VII"];

    function getChord(root, type) {
      const f = CHORDS[type];
      const ri = nIdx(root);
      const notes = f.i.map(x => nName(ri + x));
      return {root: norm(root), type, label: f.l, notes, intervals: f.i};
    }

    function fmtChord(root, type) {
      if (type === "maj") return root;
      if (type === "min") return root + "m";
      return root + type;
    }

    function getDiatonic(root, scale) {
      const s = SCALES[scale];
      const ri = nIdx(root);
      return s.iv.map((iv, idx) => {
        const cr = nName(ri + iv);
        const q = s.q[idx];
        let roman = (q === "min" || q === "dim") ? ROMAN[idx].toLowerCase() : ROMAN[idx];
        if (q === "dim") roman += "°";
        return {degree: idx+1, roman, chord: getChord(cr, q)};
      });
    }

    // ── Piano SVG Renderer ──
    function renderPiano(highlightNotes, rootNote) {
      const hSet = new Set(highlightNotes.map(n => nIdx(n)));
      const rootIdx = rootNote !== undefined ? nIdx(rootNote) : -1;
      const WW = 32, WH = 120, BW = 20, BH = 76;
      const BK_OFF = {1:-5, 3:-4, 6:-5, 8:-4, 10:-3};
      const octaves = 2;
      const whites = [], blacks = [];
      let wi = 0;
      for (let oct = 0; oct < octaves; oct++) {
        for (let n = 0; n < 12; n++) {
          if (!isBlack(n)) {
            whites.push({n, x: wi * WW});
            if (BK_OFF[n+1] !== undefined) {
              blacks.push({n: (n+1)%12, x: wi*WW + WW + BK_OFF[n+1]});
            }
            wi++;
          }
        }
      }
      const tw = wi * WW;
      let svg = `<svg viewBox="0 0 ${tw} ${WH+20}" width="${tw}" xmlns="http://www.w3.org/2000/svg">`;
      whites.forEach(({n, x}) => {
        const on = hSet.has(n), isR = n === rootIdx;
        svg += `<rect x="${x}" y="0" width="${WW-1}" height="${WH}" rx="0" ry="3" fill="${isR?'#4f8ef7':on?'#6aa3f7':'#f0f0ee'}" stroke="#666" stroke-width="0.5"/>`;
        if (on) svg += `<text x="${x+WW/2}" y="${WH+14}" text-anchor="middle" font-size="10" font-weight="${isR?700:400}" fill="#f0f0ee" font-family="Poppins,sans-serif">${nName(n)}</text>`;
      });
      blacks.forEach(({n, x}) => {
        const on = hSet.has(n), isR = n === rootIdx;
        svg += `<rect x="${x}" y="0" width="${BW}" height="${BH}" rx="0" ry="3" fill="${isR?'#2a5fc7':on?'#4f8ef7':'#1c1c1c'}" stroke="#000" stroke-width="0.5"/>`;
      });
      svg += '</svg>';
      return svg;
    }

    function chordCardHTML(chord) {
      return `
        <div class="chord-card">
          <div class="chord-name">${fmtChord(chord.root, chord.type)}</div>
          <div class="chord-label">${chord.label}</div>
          <div class="chord-detail">Notes: <b>${chord.notes.join(' - ')}</b></div>
          <div class="chord-detail">Intervals: <b style="font-family:monospace;font-size:0.78rem">${chord.intervals.join(' · ')}</b></div>
          <div class="piano-wrap">${renderPiano(chord.notes, chord.root)}</div>
        </div>`;
    }

    // ── State ──
    let state = {
      tab: 'chord',
      root: 'C',
      chordType: 'maj',
      scale: 'major',
      diaIdx: 0,
    };

    // ── Render helpers ──
    function btnRow(container, items, activeVal, onClick, cls='sel-btn') {
      container.innerHTML = '';
      items.forEach(({val, text}) => {
        const b = document.createElement('button');
        b.className = cls + (val === activeVal ? ' active' : '');
        b.textContent = text;
        b.onclick = () => onClick(val);
        container.appendChild(b);
      });
    }

    function render() {
      btnRow(
        document.getElementById('root-selector'),
        NOTES.map(n => ({val:n, text:n})),
        state.root,
        v => { state.root = v; state.diaIdx = 0; render(); }
      );

      document.querySelectorAll('.tab-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === state.tab));
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.toggle('active', p.id === 'panel-'+state.tab));

      if (state.tab === 'chord') renderChord();
      else if (state.tab === 'diatonic') renderDiatonic();
    }

    function renderChord() {
      const types = Object.entries(CHORDS).map(([k,v]) => ({val:k, text: k + ' · ' + v.l}));
      btnRow(document.getElementById('type-selector'), types, state.chordType, v => { state.chordType = v; render(); }, 'sel-btn sel-btn-sm');
      document.getElementById('chord-result').innerHTML = chordCardHTML(getChord(state.root, state.chordType));
    }

    function renderDiatonic() {
      btnRow(document.getElementById('scale-selector-d'),
        [{val:'major',text:'Major'},{val:'minor',text:'Minor'}],
        state.scale, v => { state.scale = v; state.diaIdx = 0; render(); });

      const dia = getDiatonic(state.root, state.scale);
      const row = document.getElementById('diatonic-row');
      row.innerHTML = '';
      dia.forEach((d, i) => {
        const b = document.createElement('button');
        b.className = 'degree-btn' + (i === state.diaIdx ? ' active' : '');
        b.innerHTML = `<span class="degree-roman">${d.roman}</span><span class="degree-chord">${fmtChord(d.chord.root, d.chord.type)}</span>`;
        b.onclick = () => { state.diaIdx = i; render(); };
        row.appendChild(b);
      });

      document.getElementById('diatonic-result').innerHTML = chordCardHTML(dia[state.diaIdx].chord);
    }

    // ── Tab switching ──
    document.querySelectorAll('.tab-btn').forEach(b => {
      b.onclick = () => { state.tab = b.dataset.tab; render(); };
    });

    // ── Hamburger ──
    const burger = document.getElementById('nav-burger');
    const navLinks = document.getElementById('nav-links');
    burger.addEventListener('click', () => {
      const isOpen = burger.classList.toggle('open');
      navLinks.classList.toggle('open', isOpen);
      burger.setAttribute('aria-expanded', isOpen);
    });
    navLinks.querySelectorAll('a').forEach(link => {
      link.addEventListener('click', () => {
        burger.classList.remove('open');
        navLinks.classList.remove('open');
        burger.setAttribute('aria-expanded', 'false');
      });
    });

    // ── Init ──
    render();
  </script>
</body>
</html>
