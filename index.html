<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mm's Studio</title>
  <meta name="description" content="Mm's personal site — research publications, mind tools, music, and contact." />
  <link rel="icon" href="Image/mm-cutout-logo.svg" type="image/svg+xml" />
  <script>(function(){var t=localStorage.getItem('mm-theme');if(t)document.documentElement.setAttribute('data-theme',t);else if(window.matchMedia('(prefers-color-scheme:dark)').matches)document.documentElement.setAttribute('data-theme','dark')})()</script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #F4F5F4;
      --bg-tint:   #DCE1E2;
      --ink:       #1D2020;
      --ink-soft:  #5C6262;
      --hair:      #C7CDCE;
      --accent:    #E04B00;
      --symbol-particle-density: 1;
      /* Matches the inner pages exactly, so the Mm mark never jumps on navigation. */
      --shell-gutter: clamp(.5rem, .8vw, 1rem);
      --shell-edge: var(--shell-gutter);
      --shell-mark-width: clamp(88px, 11vw, 132px);
      --shell-top-width: clamp(3rem, 5vw, 4rem);
      --shell-rail-center: calc((var(--shell-edge) + var(--shell-mark-width) + var(--shell-gutter)) / 2);
      --font-body: 'DM Sans', 'Noto Sans SC', -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', ui-monospace, monospace;
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--font-body);
      -webkit-font-smoothing: antialiased;
    }

    :focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
      position: relative;
    }

    /* subtle paper grain */
    body::after {
      content: '';
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 9999;
      opacity: 0.35;
      mix-blend-mode: multiply;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/><feColorMatrix type='saturate' values='0'/><feComponentTransfer><feFuncA type='table' tableValues='0 0.05'/></feComponentTransfer></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>");
    }

    /* ══════════ NAV GRID (2x2 centered) ══════════ */
    .stage {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 4rem 2rem;
    }

    .nav-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: clamp(3rem, 8vw, 7rem) clamp(4rem, 12vw, 10rem);
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.1rem;
      text-decoration: none;
      color: var(--ink);
      cursor: pointer;
    }

    .nav-symbol {
      width: 130px;
      height: 130px;
      display: block;
    }

    .nav-label {
      font-family: var(--font-mono);
      font-size: 0.86rem;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
      color: var(--ink);
      transition: color 0.25s;
    }

    .nav-item:hover .nav-label { color: var(--accent); }

    .site-caption {
      margin-top: clamp(2.5rem, 4vw, 3.5rem);
      color: var(--ink-soft);
      font-family: var(--font-mono);
      font-size: clamp(0.68rem, 1vw, 0.82rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .site-caption + .site-caption {
      margin-top: 0.4rem;
    }

    /* ══════════ MM FLOATING MARK ══════════ */
    .mm-card {
      position: fixed;
      right: var(--shell-rail-center);
      top: var(--shell-edge);
      z-index: 10000; /* Keep the vector mark above the paper-grain overlay. */
      width: var(--shell-mark-width);
      line-height: 0;
      padding: 0;
      border: 0;
      background: transparent;
      cursor: pointer;
      transform: translateX(50%);
    }

    .mm-card canvas {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ══════════ RESPONSIVE ══════════ */
    @media (max-width: 720px) {
      :root { --shell-gutter: .5rem; --shell-edge: var(--shell-gutter); --shell-mark-width: 70px; --shell-top-width: 2.6rem; --symbol-particle-density: .65; }
    }

    @media (max-width: 640px) {
      .nav-grid {
        gap: 2.5rem 3.5rem;
      }
      .nav-symbol { width: 92px; height: 92px; }
      .nav-label { font-size: 0.74rem; letter-spacing: 0.18em; }

      .stage { min-height: 100vh; padding: 4rem 1rem 2rem; }
    }

    @media (prefers-color-scheme: dark) {
      html:not([data-theme="light"]) {
        --bg: #111211; --bg-tint: #1c1d1c; --ink: #e2e3e2; --ink-soft: #7a7e7e; --hair: #2e3232;
      }
      html:not([data-theme="light"]) body::after { mix-blend-mode: screen; opacity: 0.12; }
    }
    html[data-theme="dark"] {
      --bg: #111211; --bg-tint: #1c1d1c; --ink: #e2e3e2; --ink-soft: #7a7e7e; --hair: #2e3232;
    }
    html[data-theme="dark"] body::after { mix-blend-mode: screen; opacity: 0.12; }

    /* Theme toggle */
    .theme-toggle {
      position: fixed;
      right: var(--shell-rail-center);
      bottom: calc(var(--shell-edge) + var(--shell-mark-width) * .27 - var(--shell-top-width) * .14);
      z-index: 10000;
      width: var(--shell-top-width);
      padding: 0; border: 0; background: transparent;
      cursor: pointer; line-height: 0;
      transform: translateX(50%);
    }
    .theme-toggle canvas { display: block; width: 100%; height: auto; }
  </style>
</head>
<body>

  <main class="stage">
    <nav class="nav-grid" aria-label="Primary">
      <a class="nav-item" href="research.html" data-symbol="circle">
        <canvas class="nav-symbol" width="260" height="260" aria-hidden="true"></canvas>
        <span class="nav-label">Research</span>
      </a>
      <a class="nav-item" href="chord-tool.html" data-symbol="minus">
        <canvas class="nav-symbol" width="260" height="260" aria-hidden="true"></canvas>
        <span class="nav-label">Mind Tools</span>
      </a>
      <a class="nav-item" href="craft.html" data-symbol="triangle">
        <canvas class="nav-symbol" width="260" height="260" aria-hidden="true"></canvas>
        <span class="nav-label">Music</span>
      </a>
      <a class="nav-item" href="about.html" data-symbol="plus">
        <canvas class="nav-symbol" width="260" height="260" aria-hidden="true"></canvas>
        <span class="nav-label">Contact</span>
      </a>
    </nav>
    <p class="site-caption">Mm's Personal Website</p>
    <p class="site-caption">Kunming, Chongqing, Perth</p>
  </main>

  <button class="mm-card" type="button" aria-label="Back to top" onclick="window.scrollTo({ top: 0, behavior: 'smooth' })">
    <canvas class="mm-symbol" width="260" height="260" aria-hidden="true"></canvas>
  </button>

  <button class="theme-toggle" type="button" aria-label="Toggle theme">
    <canvas width="260" height="260" aria-hidden="true"></canvas>
  </button>

  <script>
    // ─────────── particle symbol renderer ───────────
    // Each nav-item's canvas draws a symbol as a cloud of small ink dots that
    // continually breathe with a sine wave. Hover intensifies the wave and
    // scatters the particles further, then they return to shape.

    const SIZE = 260;                 // internal canvas resolution (matches width/height attrs)
    const CENTER = SIZE / 2;

    // sample target positions along each symbol's stroke
    function samplePoints(kind) {
      const pts = [];
      const push = (x, y) => pts.push({ tx: x, ty: y });

      // uniform look: sample any stroke of length L, thickness T with
      // a fixed per-unit density so every symbol reads as the same "cloud".
      const DENSITY_ALONG = 0.55 * PARTICLE_DENSITY;   // dots per pixel along the stroke
      const DENSITY_ACROSS = 0.50 * PARTICLE_DENSITY;  // dots per pixel across the thickness

      function fillLine(ax, ay, bx, by, thickness) {
        const dx = bx - ax, dy = by - ay;
        const len = Math.hypot(dx, dy);
        const nx = -dy / len, ny = dx / len;
        const nAlong  = Math.max(2, Math.round(len * DENSITY_ALONG));
        const nAcross = Math.max(2, Math.round(thickness * DENSITY_ACROSS));
        for (let s = 0; s < nAcross; s++) {
          const off = -thickness/2 + (s / (nAcross - 1)) * thickness;
          for (let i = 0; i < nAlong; i++) {
            const t = i / (nAlong - 1);
            // small random jitter so grid patterns don't show
            const jx = (Math.random() - 0.5) * 1.2;
            const jy = (Math.random() - 0.5) * 1.2;
            push(ax + dx * t + nx * off + jx, ay + dy * t + ny * off + jy);
          }
        }
      }

      function fillRing(cx, cy, radius, thickness) {
        const circumference = 2 * Math.PI * radius;
        const nAlong  = Math.max(24, Math.round(circumference * DENSITY_ALONG));
        const nAcross = Math.max(2,  Math.round(thickness * DENSITY_ACROSS));
        for (let s = 0; s < nAcross; s++) {
          const r = radius - thickness/2 + (s / (nAcross - 1)) * thickness;
          for (let i = 0; i < nAlong; i++) {
            const a = (i / nAlong) * Math.PI * 2;
            const jx = (Math.random() - 0.5) * 1.2;
            const jy = (Math.random() - 0.5) * 1.2;
            push(cx + Math.cos(a) * r + jx, cy + Math.sin(a) * r + jy);
          }
        }
      }

      const T = 22;   // uniform stroke thickness for every symbol

      if (kind === 'circle') {
        fillRing(CENTER, CENTER, 78, T);
      }

      if (kind === 'minus') {
        const halfLen = 80;
        fillLine(CENTER - halfLen, CENTER, CENTER + halfLen, CENTER, T);
      }

      if (kind === 'triangle') {
        const size = 92;                        // half-base
        const h = size * Math.sqrt(3);
        const cy = CENTER + h / 3;              // centroid at CENTER
        const A = { x: CENTER,          y: cy - h };
        const B = { x: CENTER - size,   y: cy };
        const C = { x: CENTER + size,   y: cy };
        fillLine(A.x, A.y, B.x, B.y, T);
        fillLine(B.x, B.y, C.x, C.y, T);
        fillLine(C.x, C.y, A.x, A.y, T);
      }

      if (kind === 'plus') {
        const halfLen = 78;
        fillLine(CENTER - halfLen, CENTER, CENTER + halfLen, CENTER, T);
        fillLine(CENTER, CENTER - halfLen, CENTER, CENTER + halfLen, T);
      }

      return pts;
    }

    class ParticleSymbol {
      constructor(canvas, kind) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.kind = kind;
        this.hover = 0;         // eased 0→1
        this.hoverTarget = 0;
        this.t = 0;

        const targets = samplePoints(kind);
        this.particles = targets.map(p => ({
          tx: p.tx,
          ty: p.ty,
          x: p.tx + (Math.random() - 0.5) * 6,
          y: p.ty + (Math.random() - 0.5) * 6,
          phase: Math.random() * Math.PI * 2,
          drift: 0.6 + Math.random() * 0.8,
        }));
      }

      setHover(on) { this.hoverTarget = on ? 1 : 0; }

      draw() {
        const ctx = this.ctx;
        ctx.clearRect(0, 0, SIZE, SIZE);
        ctx.fillStyle = particleInk;

        // ease hover state
        this.hover += (this.hoverTarget - this.hover) * 0.08;
        this.t += 0.025;

        const waveAmp = REDUCED_MOTION ? 0 : 1.2 + this.hover * 6.5;         // amplitude of continuous breathing
        const scatterAmt = REDUCED_MOTION ? 0 : this.hover * 4.0;             // extra chaos on hover
        const dotSize = 1.35 + this.hover * 0.55;

        for (const p of this.particles) {
          // continuous wave: phase driven by both time and spatial position → wave pattern rolls across the shape
          const spatial = (p.tx - CENTER) * 0.035 + (p.ty - CENTER) * 0.035;
          const wave = Math.sin(this.t * 1.6 + p.phase + spatial);
          const wave2 = Math.cos(this.t * 1.1 + p.phase * 0.7 + spatial * 1.4);

          const nx = Math.cos(p.phase * 3.1);
          const ny = Math.sin(p.phase * 3.1);

          const dx = wave * waveAmp * nx + wave2 * scatterAmt * (Math.random() - 0.5 + 0.5);
          const dy = wave * waveAmp * ny + wave2 * scatterAmt * (Math.random() - 0.5 + 0.5);

          ctx.beginPath();
          ctx.arc(p.tx + dx, p.ty + dy, dotSize, 0, Math.PI * 2);
          ctx.fill();
        }
      }
    }

    // One value controls every particle symbol on the home page, including Mm.
    // Use .5 for a lighter system, 1 for the default, or 1.5 for a denser system.
    const PARTICLE_DENSITY = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--symbol-particle-density')) || 1;
    // Ambient breathing/scatter is decorative motion; OS-level reduced-motion
    // preference turns it off, keeping only user-triggered transitions (e.g. the toggle morph).
    const REDUCED_MOTION = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    // Same per-area weight as the nav symbols (0.55 × 0.50 dots/px²), shared by
    // every other particle shape (Mm mark, toggle) so no cloud reads thinner.
    const GLYPH_STEP = 1 / Math.sqrt(0.55 * 0.50 * PARTICLE_DENSITY);
    let particleInk = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1D2020';
    function updateParticleInk() {
      particleInk = getComputedStyle(document.documentElement).getPropertyValue('--ink').trim() || '#1D2020';
    }
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', (e) => {
      if (!localStorage.getItem('mm-theme')) {
        document.documentElement.setAttribute('data-theme', e.matches ? 'dark' : 'light');
        updateParticleInk();
      }
    });

    function sampleFloatingM() {
      const stencil = document.createElement('canvas');
      stencil.width = SIZE;
      stencil.height = SIZE;
      const context = stencil.getContext('2d', { willReadFrequently: true });
      context.fillStyle = '#1D2020';
      context.font = '700 150px DM Sans, Arial, sans-serif';
      context.textBaseline = 'alphabetic';
      const baseline = 182;
      const stemRow = 150;
      const stemCenter = (letter, x, side) => {
        context.clearRect(0, 0, SIZE, SIZE);
        context.fillText(letter, x, baseline);
        const data = context.getImageData(0, stemRow, SIZE, 1).data;
        const runs = [];
        let start = null;
        for (let px = 0; px < SIZE; px++) {
          if (data[px * 4 + 3] > 180 && start === null) start = px;
          if ((data[px * 4 + 3] <= 180 || px === SIZE - 1) && start !== null) {
            runs.push([start, px - 1]);
            start = null;
          }
        }
        const run = side === 'right' ? runs[runs.length - 1] : runs[0];
        return (run[0] + run[1]) / 2;
      };
      const mRightStem = stemCenter('M', 8, 'right');
      const mLeftStem = stemCenter('m', 0, 'left');
      const mX = mRightStem - mLeftStem;
      context.clearRect(0, 0, SIZE, SIZE);
      context.fillText('M', 8, baseline);
      context.fillText('m', mX, baseline);
      const mark = context.getImageData(0, 0, SIZE, SIZE);
      let minX = SIZE;
      let maxX = 0;
      for (let y = 0; y < SIZE; y++) {
        for (let x = 0; x < SIZE; x++) {
          if (mark.data[(y * SIZE + x) * 4 + 3] > 180) {
            minX = Math.min(minX, x);
            maxX = Math.max(maxX, x);
          }
        }
      }
      context.clearRect(0, 0, SIZE, SIZE);
      context.putImageData(mark, Math.round(SIZE / 2 - (minX + maxX) / 2), 0);
      const pixels = context.getImageData(0, 0, SIZE, SIZE).data;
      const points = [];
      for (let y = 18; y < 226; y += GLYPH_STEP) {
        for (let x = 8; x < 252; x += GLYPH_STEP) {
          if (pixels[(Math.round(y) * SIZE + Math.round(x)) * 4 + 3] > 180) points.push({ x, y });
        }
      }
      return points.sort(() => Math.random() - .5);
    }

    class FloatingM {
      constructor(canvas) {
        this.canvas = canvas;
        this.ctx = canvas.getContext('2d');
        this.hover = 0;
        this.hoverTarget = 0;
        this.t = 0;
        this.particles = sampleFloatingM().map(p => ({
          x: p.x + (Math.random() - .5), y: p.y + (Math.random() - .5),
          phase: Math.random() * Math.PI * 2, direction: Math.random() * Math.PI * 2
        }));
      }
      setHover(on) { this.hoverTarget = on ? 1 : 0; }
      draw() {
        this.hover += (this.hoverTarget - this.hover) * .08;
        this.t += .025;
        this.ctx.clearRect(0, 0, SIZE, SIZE);
        this.ctx.fillStyle = particleInk;
        this.particles.forEach(p => {
          const movement = REDUCED_MOTION ? 0 : Math.sin(this.t * 1.5 + p.phase) * (1.1 + this.hover * 3) + this.hover * (5 + Math.sin(this.t + p.phase) * 3);
          this.ctx.beginPath();
          this.ctx.arc(p.x + Math.cos(p.direction) * movement, p.y + Math.sin(p.direction) * movement, 1.35 + this.hover * .55, 0, Math.PI * 2);
          this.ctx.fill();
        });
      }
    }

    // Moon/Sun theme toggle
    const TC = SIZE / 2;
    function sampleCrescent() {
      const R = 80, r = 65, ox = 32, oy = -22, pts = [];
      for (let y = 0; y < SIZE; y += GLYPH_STEP)
        for (let x = 0; x < SIZE; x += GLYPH_STEP)
          if (Math.hypot(x - TC, y - TC) <= R && Math.hypot(x - TC - ox, y - TC - oy) > r)
            pts.push({ x: x + (Math.random() - .5), y: y + (Math.random() - .5) });
      return pts.sort(() => Math.random() - .5);
    }
    function sampleSunShape() {
      const R = 38, pts = [];
      for (let y = TC - R; y <= TC + R; y += GLYPH_STEP)
        for (let x = TC - R; x <= TC + R; x += GLYPH_STEP)
          if (Math.hypot(x - TC, y - TC) <= R) pts.push({ x, y });
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2, c = Math.cos(a), s = Math.sin(a);
        for (let r = R + 14; r <= R + 35; r += GLYPH_STEP)
          for (let w = -5; w <= 5; w += GLYPH_STEP)
            pts.push({ x: TC + c * r - s * w, y: TC + s * r + c * w });
      }
      return pts.sort(() => Math.random() - .5);
    }

    class HomeThemeToggle {
      constructor(canvas, isDark) {
        this.ctx = canvas.getContext('2d');
        this.hover = 0; this.hoverTarget = 0; this.t = 0; this.isDark = isDark;
        const moonAll = sampleCrescent(), sunAll = sampleSunShape();
        const count = Math.min(moonAll.length, sunAll.length);
        const moon = moonAll.slice(0, count), sun = sunAll.slice(0, count);
        this.particles = moon.map((m, i) => ({
          x: isDark ? sun[i].x : m.x, y: isDark ? sun[i].y : m.y,
          moonX: m.x, moonY: m.y, sunX: sun[i].x, sunY: sun[i].y,
          phase: Math.random() * Math.PI * 2, dir: Math.random() * Math.PI * 2
        }));
      }
      setHover(on) { this.hoverTarget = on ? 1 : 0; }
      setDark(dark) { this.isDark = dark; }
      draw() {
        this.hover += (this.hoverTarget - this.hover) * .08;
        this.t += .025;
        this.ctx.clearRect(0, 0, SIZE, SIZE);
        this.ctx.fillStyle = particleInk;
        const amp = REDUCED_MOTION ? 0 : 1.0 + this.hover * 4, dot = 1.35 + this.hover * .55;
        for (const p of this.particles) {
          p.x += ((this.isDark ? p.sunX : p.moonX) - p.x) * .06;
          p.y += ((this.isDark ? p.sunY : p.moonY) - p.y) * .06;
          const w = Math.sin(this.t * 1.6 + p.phase);
          this.ctx.beginPath();
          this.ctx.arc(p.x + w * amp * Math.cos(p.dir), p.y + w * amp * Math.sin(p.dir), dot, 0, Math.PI * 2);
          this.ctx.fill();
        }
      }
    }

    // instantiate one per nav item
    const symbols = [];
    document.querySelectorAll('.nav-item').forEach(item => {
      const canvas = item.querySelector('canvas');
      const kind = item.dataset.symbol;
      const s = new ParticleSymbol(canvas, kind);
      symbols.push(s);

      item.addEventListener('mouseenter', () => s.setHover(true));
      item.addEventListener('mouseleave', () => s.setHover(false));
      item.addEventListener('focus',      () => s.setHover(true));
      item.addEventListener('blur',       () => s.setHover(false));
    });

    const floatingM = new FloatingM(document.querySelector('.mm-symbol'));
    const floatingCard = document.querySelector('.mm-card');
    floatingCard.addEventListener('mouseenter', () => floatingM.setHover(true));
    floatingCard.addEventListener('mouseleave', () => floatingM.setHover(false));
    floatingCard.addEventListener('focus', () => floatingM.setHover(true));
    floatingCard.addEventListener('blur', () => floatingM.setHover(false));

    // theme toggle
    const toggleEl = document.querySelector('.theme-toggle');
    const isDarkNow = document.documentElement.getAttribute('data-theme') === 'dark';
    const themeToggle = new HomeThemeToggle(toggleEl.querySelector('canvas'), isDarkNow);
    toggleEl.addEventListener('click', () => {
      const cur = document.documentElement.getAttribute('data-theme');
      const next = cur === 'dark' ? 'light' : 'dark';
      localStorage.setItem('mm-theme', next);
      document.documentElement.setAttribute('data-theme', next);
      updateParticleInk();
      themeToggle.setDark(next === 'dark');
    });
    toggleEl.addEventListener('mouseenter', () => themeToggle.setHover(true));
    toggleEl.addEventListener('mouseleave', () => themeToggle.setHover(false));

    // single animation loop
    function loop() {
      for (const s of symbols) s.draw();
      floatingM.draw();
      themeToggle.draw();
      requestAnimationFrame(loop);
    }
    loop();
  </script>
</body>
</html>
