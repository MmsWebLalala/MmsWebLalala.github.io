    .profile {

    }
    .profile-avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .profile-bio {
      margin: 0;
      color: var(--shell-soft);
      font: 400 1rem/1.75 var(--shell-body);
    }

    /* Icon-only contacts, each drawn as a particle cloud. Hover scatters the
       dots and turns them teal — including Bandcamp, which has no page yet and
       so is a plain element rather than a link. The negative left margin lines
       the first glyph up with the bio text instead of its hover plate. */
    .contact-icons {

      gap: .35rem;
      margin: 1.1rem 0 0 -.55rem;
      padding: 0;
      list-style: none;
    }

    .contact-icon {
      display: grid;
      place-items: center;
      width: 3.6rem;
      height: 3.6rem;
      border-radius: calc(var(--shell-radius) - .35rem);
      transition: background-color .2s ease;
    }
    .contact-icon:hover { background: var(--shell-card-muted); }
    .contact-icon canvas { width: 2.5rem; height: 2.5rem; display: block; }

    @media (max-width: 560px) {

    }

    .groups-label { margin: clamp(1.5rem, 3vw, 2.5rem) 0 1rem !important; padding: 0 var(--shell-title-inset); }

  <script>
  // Contact icons as particle clouds: each 24×24 glyph is drawn into a stencil
  // and sampled like the Mm mark, scaled so the dots read at the Mm mark's size
  // even though the icon is far smaller. Hover scatters them and turns them teal.
  (function () {
    function start() {
      const { SIZE, glyphStep, sampleDrawing, ParticleCloud } = window.MmParticles;
      const root = document.documentElement;
      const density = parseFloat(getComputedStyle(root).getPropertyValue('--symbol-particle-density')) || 1;
      // The Mm mark is drawn 130px wide on screen; match its on-screen dot size.
      const MARK_WIDTH = 130;

      let ink, accent;
      const readColors = () => {
        const styles = getComputedStyle(root);
        ink = styles.getPropertyValue('--shell-ink').trim() || '#1d2020';
        accent = styles.getPropertyValue('--shell-accent').trim() || '#067b85';
      };
      readColors();
      new MutationObserver(readColors).observe(root, { attributes: true, attributeFilter: ['data-theme'] });

      const clouds = [...document.querySelectorAll('canvas[data-icon]')].map((canvas) => {
        const scale = MARK_WIDTH / canvas.clientWidth;
        const glyph = new Path2D(canvas.dataset.icon);
        // The glyph fills 70% of the canvas, centred, leaving room to scatter.
        const points = sampleDrawing((g) => {
          const s = SIZE * .7 / 24;
          g.translate(SIZE / 2 - 12 * s, SIZE / 2 - 12 * s);
          g.scale(s, s);
          g.fill(glyph);
        }, glyphStep(density) * scale);
        const cloud = new ParticleCloud(canvas, points, () => (cloud.hoverTarget ? accent : ink), null, { scale });
        cloud.bindHover(canvas.closest('.contact-icon'));
        return cloud;
      });

      (function loop() {
        clouds.forEach((cloud) => cloud.draw());
        requestAnimationFrame(loop);
      })();
    }

    // particles.js is deferred; wait for it rather than running ahead of it.
    if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
    else start();
  })();
  </script>
